name: fota-api-dev

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api.dev
    container_name: fota-api-dev
    user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 5050
      HOST: 0.0.0.0
    ports:
      - '5050:5050'
    volumes:
      - .:/app
      - ./node_modules:/app/node_modules
      - ../../node_modules:/node_modules

    networks:
      - fota_network
      - supabase_network

networks:
  fota_network:
    external: true
    name: fota_network
  supabase_network:
    external: true
    name: supabase_default
