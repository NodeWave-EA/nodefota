name: fota-api-dev

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api.dev
    container_name: fota-api-dev
    user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
    env_file:
      - .env
      - .env.supabase
    environment:
      NODE_ENV: development
      PORT: 5050
      HOST: 0.0.0.0
      SUPABASE_URL: http://api-gw:8000
    ports:
      - '5050:5050'
    volumes:
      - .:/app
      - fota_api_dev_node_modules:/app/node_modules
    networks:
      - fota_network
      - supabase_network

    develop:
      watch:
        # Sync source code
        - action: sync
          path: ./src
          target: /app/src
        # Sync Prisma schema changes
        - action: sync
          path: ./prisma
          target: /app/prisma
        # Restart container on environment variable updates
        - action: sync+restart
          path: .env
          target: /app/.env
        - action: sync+restart
          path: .env.supabase
          target: /app/.env.supabase
        # Rebuild container image if dependencies change
        - action: rebuild
          path: package.json

networks:
  fota_network:
    external: true
    name: fota_network
  supabase_network:
    external: true
    name: supabase_default

volumes:
  fota_api_dev_node_modules:
    name: fota_api_dev_node_modules
