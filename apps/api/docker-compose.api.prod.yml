name: fota-api-prod

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api.prod
    container_name: fota-api
    restart: unless-stopped
    user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
    env_file:
      - .env
      - .env.supabase
    environment:
      NODE_ENV: production
      PORT: 5050
      HOST: 0.0.0.0
      SUPABASE_URL: http://api-gw:8000
    ports:
      - '5050:5050'
    networks:
      - fota_network
      - supabase_network

networks:
  fota_network:
    external: true
    name: fota_network
  supabase_network:
    external: true
    name: supabase_default
