name: fota-web-dev

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web.dev
    container_name: fota-web-dev
    user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
    env_file:
      - .env
    environment:
      NODE_ENV: development
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: 5040
    ports:
      - '5040:5040'
    volumes:
      - .:/app
      - ./node_modules:/app/node_modules
      - ../../node_modules:/node_modules
      - ./.nuxt:/app/.nuxt
    networks:
      - fota_network
      - supabase_network

networks:
  fota_network:
    external: true
    name: fota_network
  supabase_network:
    external: true
    name: supabase_default
