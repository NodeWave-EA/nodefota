name: fota-web-dev

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web.dev
    container_name: fota-web-dev
    user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
    env_file:
      - .env
      - .env.supabase
    environment:
      NODE_ENV: development
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: 5040
    ports:
      - '5040:5040'
    volumes:
      # Mount web directory to container app root
      - .:/app
      # Named volumes for dependencies and build outputs
      - fota_web_dev_node_modules:/app/node_modules
      - fota_web_dev_nuxt:/app/.nuxt
    networks:
      - fota_network
      - supabase_network

    develop:
      watch:
        # Sync changes across web directory for hot-reloading (ignoring build & dep folders)
        - action: sync
          path: ./
          target: /app
          ignore:
            - node_modules/
            - .nuxt/
            - .output/
        # Restart container on env variable updates
        - action: sync+restart
          path: .env
          target: /app/.env
        - action: sync+restart
          path: .env.supabase
          target: /app/.env.supabase
        # Rebuild container image when package dependencies update
        - action: rebuild
          path: package.json

networks:
  fota_network:
    external: true
    name: fota_network
  supabase_network:
    external: true
    name: supabase_default

volumes:
  fota_web_dev_node_modules:
    name: fota_web_dev_node_modules
  fota_web_dev_nuxt:
    name: fota_web_dev_nuxt
