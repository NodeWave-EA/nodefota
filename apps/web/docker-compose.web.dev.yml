name: fota-web-dev

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web.dev
    container_name: fota-web-dev
    env_file:
      - .env
    environment:
      NODE_ENV: development
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: 5040
    ports:
      - '5040:5040'
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - web_nuxt:/app/.nuxt
    networks:
      - fota_network
      - supabase_network

volumes:
  web_node_modules:
    name: fota_web_dev_node_modules
  web_nuxt:
    name: fota_web_dev_nuxt

networks:
  fota_network:
    external: true
    name: fota_network
  supabase_network:
    external: true
    name: supabase_default
